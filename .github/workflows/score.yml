name: Score the forecast

# Run by hand once the IEC has declared the final results: scores frozen/ against them and adds a
# "How did the forecast do?" section to the site.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    env:
      ELECTION_DATA: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/score.py 2026
      - name: Rebuild the site on the latest main and commit
        # Election-night updates can land while this runs and both write docs/, so take theirs first and build
        # the site once, on top of them, instead of rebasing a stale build.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git pull --rebase
          git stash pop
          python src/build_site.py
          git add outputs docs
          git diff --cached --quiet || (git commit -m "Score forecast against final results" && git push)
